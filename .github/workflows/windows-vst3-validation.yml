name: Windows VST3 Validation

# Windows minutes bill at 2x. Bursts of pushes each ran a full build to
# completion (27 on 2026-09-10), which helped exhaust the account's Actions
# minutes. A newer push now cancels the superseded run: the tester bundle still
# tracks the latest master. Docs/receipt-only pushes skip the build.
on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - 'receipts/**'
      - 'research/**'
      - '**/*.md'
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: windows-vst3-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-vst3:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run DSP core tests
        run: .\build\Release\monkeys_ear_test_runner.exe

      - name: Run Vocal tracker characterization
        run: .\build\Release\monkeys_ear_vocal_tracker_probe.exe

      - name: Run combined VST3 host probe
        run: .\build\Release\monkeys_ear_host_probe.exe

      - name: Run standalone Vocal VST3 host and automation probe
        run: .\build\Release\monkeys_ear_vocal_host_probe.exe

      - name: Assemble and verify tester-facing Voice/Vocal bundle
        shell: pwsh
        run: |
          .\packaging\package_voice_vocal.ps1 `
            -Binary .\build\Release\monkeys_ear_vocal.vst3 `
            -OutputDirectory .\dist `
            -Commit "${{ github.sha }}"

      - name: Preserve tester-facing Voice/Vocal bundle
        uses: actions/upload-artifact@v4
        with:
          name: monkeys-ear-voice-vocal-validation-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Preserve validated Windows VST3 binaries
        uses: actions/upload-artifact@v4
        with:
          name: monkeys-ear-windows-vst3-${{ github.sha }}
          path: |
            build/Release/monkeys_ear.vst3
            build/Release/monkeys_ear_vocal.vst3
          if-no-files-found: error
          retention-days: 14
